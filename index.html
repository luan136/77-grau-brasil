
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>77 GRAU BRASIL</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;color:white;font-weight:bold;text-shadow:2px 2px 4px black;z-index:2;font-size:17px}
#speed{font-size:25px;color:#ff3939}
#controls{position:fixed;bottom:22px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 18px;z-index:3}
.group{display:flex;gap:10px;align-items:end}
button{width:65px;height:65px;border:2px solid #fff;border-radius:50%;background:#171717cc;color:white;font-size:23px;font-weight:bold;touch-action:none}
#gas{background:#c51d1d}
#wheelie{background:#c56b13}
#menu{position:fixed;inset:0;background:linear-gradient(#111c,#000e);display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;z-index:5;text-align:center}
#menu h1{font-size:38px;color:#ff3030;margin-bottom:5px}
#menu p{color:#ddd}
#play{width:190px;height:58px;border-radius:12px;background:#c51d1d;font-size:20px;margin-top:25px}
</style>
</head>
<body>

<div id="hud">
  77 GRAU BRASIL<br>
  <span id="speed">0 KM/H</span>
</div>

<div id="menu">
  <h1>77 GRAU BRASIL</h1>
  <p>O mundo do grau começa aqui!</p>
  <button id="play">JOGAR</button>
</div>

<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="wheelie">GRAU</button>
    <button id="brake">▼</button>
    <button id="gas">▲</button>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,45,180);

const camera = new THREE.PerspectiveCamera(
  70,innerWidth/innerHeight,0.1,500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536044,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,40,20);
sun.castShadow=true;
scene.add(sun);

function material(color){
 return new THREE.MeshStandardMaterial({color});
}

function box(w,h,d,color,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

// TERRENO
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 material(0x477c36)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.12;
scene.add(ground);

// ESTRADA
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(13,500),
 material(0x292929)
);
road.rotation.x=-Math.PI/2;
road.position.y=-0.04;
scene.add(road);

// FAIXAS DA ESTRADA
for(let z=-240;z<250;z+=12){
 box(.16,.025,5,0xffffff,0,.01,z);
}

// ÁRVORES E CASAS
for(let z=-220;z<230;z+=22){
 for(const side of [-1,1]){
  const x=side*(10+Math.random()*8);
  box(.45,2,.45,0x654321,x,1,z);
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(1.8,4,8),
   material(0x176b32)
  );
  leaves.position.set(x,3.5,z);
  scene.add(leaves);

  if(Math.random()>.55){
   box(4,3,4,0xc6a06b,side*17,1.5,z-7);
   box(4.5,.3,4.5,0x963333,side*17,3.1,z-7);
  }
 }
}

// MOTO
const bike=new THREE.Group();
scene.add(bike);

const frontWheel=new THREE.Group();
const rearWheel=new THREE.Group();

function makeWheel(parent,z){
 const tire=new THREE.Mesh(
  new THREE.TorusGeometry(.43,.12,12,24),
  material(0x111111)
 );
 tire.rotation.y=Math.PI/2;
 tire.position.set(0,.53,z);
 parent.add(tire);

 const hub=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.12,.25,16),
  material(0xaaaaaa)
 );
 hub.rotation.z=Math.PI/2;
 hub.position.set(0,.53,z);
 parent.add(hub);
}
makeWheel(bike,-1.15);
makeWheel(bike,1.15);

box(.38,.35,1.25,0xc51d1d,0,.95,0,bike);
box(.43,.25,.55,0x111111,0,1.22,-.2,bike);
box(.12,.12,.9,0xaaaaaa,0,1.22,.45,bike);
box(.8,.12,.12,0x222222,0,1.3,.95,bike);
box(.3,.22,.3,0xffffff,0,1.15,1.35,bike);

// PILOTO
box(.45,.7,.35,0x202020,0,1.7,-.15,bike);
const helmet=new THREE.Mesh(
 new THREE.SphereGeometry(.25,20,16),
 material(0xffffff)
);
helmet.position.set(0,2.18,-.15);
bike.add(helmet);

const visor=box(.3,.1,.08,0x111111,0,2.2,.06,bike);

// CONTROLES
const keys={};
function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 function release(e){
  keys[key]=false;
 }
 el.addEventListener('pointerup',release);
 el.addEventListener('pointercancel',release);
 el.addEventListener('lostpointercapture',release);
}
bind('gas','gas');
bind('brake','brake');
bind('left','left');
bind('right','right');
bind('wheelie','wheelie');

// JOGO
let speed=0;
let started=false;
let wheelie=0;

document.getElementById('play').onclick=()=>{
 started=true;
 document.getElementById('menu').style.display='none';
};

function animate(){
 requestAnimationFrame(animate);

 if(started){
  if(keys.gas)speed=Math.min(speed+.018,1.5);
  else speed=Math.max(speed-.006,0);

  if(keys.brake)speed=Math.max(speed-.04,0);

  let steering=0;
  if(keys.left)steering=1;
  if(keys.right)steering=-1;

  bike.position.x+=steering*speed*.045;
  bike.position.x=THREE.MathUtils.clamp(
   bike.position.x,-5,5
  );

  bike.position.z-=speed*.12;

  const targetWheelie=keys.wheelie && speed>.2 ? .42:0;
  wheelie+=(targetWheelie-wheelie)*.08;

  bike.rotation.x=wheelie;
  bike.rotation.z=steering*.08;

  camera.position.set(
   bike.position.x,
   bike.position.y+4.2,
   bike.position.z+7.5
  );
  camera.lookAt(
   bike.position.x,
   bike.position.y+1,
   bike.position.z-5
  );

  document.getElementById('speed').textContent=
   Math.round(speed*100)+' KM/H';
 }else{
  camera.position.set(0,5,9);
  camera.lookAt(0,1,0);
 }

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
