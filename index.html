
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>77 GRAU BRASIL</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;color:white;font-weight:bold;text-shadow:2px 2px 4px black}
#controls{position:fixed;bottom:25px;width:100%;display:flex;justify-content:space-between;padding:0 20px}
.group{display:flex;gap:12px}
button{width:65px;height:65px;border:2px solid white;border-radius:50%;background:#111b;color:white;font-size:22px}
#gas{background:#b82020dd}
</style>
</head>
<body>
<div id="hud">77 GRAU BRASIL<br><span id="speed">0 KM/H</span></div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="gas">▲</button>
    <button id="brake">▼</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 180);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,40,20);
scene.add(sun);

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x477c36})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.08;
scene.add(ground);

const road = new THREE.Mesh(
 new THREE.PlaneGeometry(12,500),
 new THREE.MeshStandardMaterial({color:0x292929})
);
road.rotation.x=-Math.PI/2;
road.position.y=0;
scene.add(road);

for(let z=-240;z<250;z+=12){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.18,.03,5),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 line.position.set(0,.03,z);
 scene.add(line);
}

function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));
 m.position.set(x,y,z);scene.add(m);return m;
}

const bike=new THREE.Group();
scene.add(bike);

function wheel(z){
 const w=new THREE.Mesh(
  new THREE.CylinderGeometry(.48,.48,.22,24),
  new THREE.MeshStandardMaterial({color:0x111111})
 );
 w.rotation.z=Math.PI/2;
 w.position.set(0,.55,z);
 bike.add(w);
 const hub=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.13,.24,16),
  new THREE.MeshStandardMaterial({color:0xaaaaaa})
 );
 hub.rotation.z=Math.PI/2;hub.position.copy(w.position);bike.add(hub);
}
wheel(-1.25);wheel(1.15);

box(.35,.35,1.3,0xcc2222,0,.95,0);
box(.45,.25,.55,0x111111,0,1.22,-.25);
box(.12,.12,.8,0xaaaaaa,0,1.2,.45);
box(.8,.12,.12,0x222222,0,1.25,.95);
box(.3,.25,.3,0xffffff,0,1.2,1.35);

const rider=box(.48,.75,.35,0x222222,0,1.75,-.1);
const helmet= new THREE.Mesh(
 new THREE.SphereGeometry(.25,16,16),
 new THREE.MeshStandardMaterial({color:0xffffff})
);
helmet.position.set(0,2.25,-.1);bike.add(helmet);

let speed=0,steer=0;
const keys={};
function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false));
}
bind('gas','gas');bind('brake','brake');
bind('left','left');bind('right','right');

function animate(){
 requestAnimationFrame(animate);
 if(keys.gas)speed=Math.min(speed+.012,1.2);
 else speed=Math.max(speed-.004,0);
 if(keys.brake)speed=Math.max(speed-.025,0);
 steer=0;
 if(keys.left)steer=1;
 if(keys.right)steer=-1;
 bike.position.x+=steer*speed*.045;
 bike.position.x=THREE.MathUtils.clamp(bike.position.x,-4.5,4.5);
 bike.position.z-=speed*.12;
 bike.rotation.y=steer*.12;
 camera.position.set(bike.position.x,bike.position.y+4,bike.position.z+7);
 camera.lookAt(bike.position.x,1,bike.position.z-5);
 document.getElementById('speed').textContent=Math.round(speed*100)+' KM/H';
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
